<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290" role="img" aria-label="Agent loop: observe, plan, act, use tools, update memory, then feed back into the next observation">
<style>.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}</style>
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1E2A26" stroke-width="1" opacity=".5"/></pattern></defs>
<rect width="880" height="290" rx="18" fill="#0B0F0E"/><rect width="880" height="290" rx="18" fill="url(#g)"/>
<rect x=".5" y=".5" width="879" height="289" rx="18" fill="none" stroke="#1E2A26"/>
<text x="24" y="42" class="m" font-size="12" fill="#7A8F88">the loop around the model</text>
<rect x="20" y="84" width="136" height="76" rx="12" fill="#111815" fill-opacity="1" stroke="#1E2A26" stroke-opacity="1"/><text x="36" y="118" class="s" font-size="18" font-weight="700" fill="#E6F2EE">Observe</text><text x="36" y="140" class="m" font-size="10.5" fill="#7A8F88">input and state</text><line x1="162" y1="122" x2="184" y2="122" stroke="#63F2C2" stroke-opacity=".7" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></line><polygon points="190,122 183,118 183,126" fill="#63F2C2"/><rect x="196" y="84" width="136" height="76" rx="12" fill="#111815" fill-opacity="1" stroke="#1E2A26" stroke-opacity="1"/><text x="212" y="118" class="s" font-size="18" font-weight="700" fill="#E6F2EE">Plan</text><text x="212" y="140" class="m" font-size="10.5" fill="#7A8F88">break down the goal</text><line x1="338" y1="122" x2="360" y2="122" stroke="#63F2C2" stroke-opacity=".7" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></line><polygon points="366,122 359,118 359,126" fill="#63F2C2"/><rect x="372" y="84" width="136" height="76" rx="12" fill="#111815" fill-opacity="1" stroke="#1E2A26" stroke-opacity="1"/><text x="388" y="118" class="s" font-size="18" font-weight="700" fill="#E6F2EE">Act</text><text x="388" y="140" class="m" font-size="10.5" fill="#7A8F88">choose an action</text><line x1="514" y1="122" x2="536" y2="122" stroke="#63F2C2" stroke-opacity=".7" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></line><polygon points="542,122 535,118 535,126" fill="#63F2C2"/><rect x="548" y="84" width="136" height="76" rx="12" fill="#63F2C2" fill-opacity="0.08" stroke="#63F2C2" stroke-opacity="0.9"/><text x="564" y="118" class="s" font-size="18" font-weight="700" fill="#E6F2EE">Tools</text><text x="564" y="140" class="m" font-size="10.5" fill="#7A8F88">typed contracts</text><line x1="690" y1="122" x2="712" y2="122" stroke="#63F2C2" stroke-opacity=".7" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></line><polygon points="718,122 711,118 711,126" fill="#63F2C2"/><rect x="724" y="84" width="136" height="76" rx="12" fill="#111815" fill-opacity="1" stroke="#1E2A26" stroke-opacity="1"/><text x="740" y="118" class="s" font-size="18" font-weight="700" fill="#E6F2EE">Memory</text><text x="740" y="140" class="m" font-size="10.5" fill="#7A8F88">keep and recall</text>
<path d="M792 160 V214 Q792 240 766 240 H114 Q88 240 88 214 V170" fill="none" stroke="#63F2C2" stroke-opacity=".5" stroke-dasharray="3 5"><animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.2s" repeatCount="indefinite"/></path>
<polygon points="88,162 83,172 93,172" fill="#63F2C2"/>
<rect x="270" y="227" width="340" height="26" rx="13" fill="#0B0F0E"/>
<text x="440" y="244" text-anchor="middle" class="m" font-size="11" fill="#A9BDB6">feedback, retry, validate, recover</text>
<circle r="10" fill="#63F2C2" opacity=".25"><animateMotion dur="9s" repeatCount="indefinite" path="M88 122 H792 V214 Q792 240 766 240 H114 Q88 240 88 214 Z"/></circle>
<circle r="4" fill="#63F2C2"><animateMotion dur="9s" repeatCount="indefinite" path="M88 122 H792 V214 Q792 240 766 240 H114 Q88 240 88 214 Z"/></circle>
</svg>