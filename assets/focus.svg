<svg xmlns="http://www.w3.org/2000/svg" width="880" height="160" viewBox="0 0 880 160" role="img" aria-label="Focus areas: tool contracts, memory, execution loops, failure handling"><style>.m{font-family:'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}.s{font-family:Inter,'Segoe UI',-apple-system,Helvetica,Arial,sans-serif}</style><rect x="0.5" y="10.5" width="204" height="139" rx="14" fill="#111815" stroke="#1E2A26"/><rect x="20" y="30" width="34" height="34" rx="9" fill="#63F2C2" fill-opacity=".10" stroke="#63F2C2" stroke-opacity=".4"/><text x="37" y="52" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#63F2C2">{ }</text><text x="20" y="92" class="s" font-size="15" font-weight="700" fill="#E6F2EE">Tool contracts</text><text x="20" y="114" class="s" font-size="12" fill="#A9BDB6">Typed inputs, clear errors,</text><text x="20" y="131" class="s" font-size="12" fill="#A9BDB6">predictable side effects.</text><rect x="225.5" y="10.5" width="204" height="139" rx="14" fill="#111815" stroke="#1E2A26"/><rect x="245" y="30" width="34" height="34" rx="9" fill="#63F2C2" fill-opacity=".10" stroke="#63F2C2" stroke-opacity=".4"/><text x="262" y="52" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#63F2C2">≣</text><text x="245" y="92" class="s" font-size="15" font-weight="700" fill="#E6F2EE">Memory</text><text x="245" y="114" class="s" font-size="12" fill="#A9BDB6">What to keep, what to drop,</text><text x="245" y="131" class="s" font-size="12" fill="#A9BDB6">and when to recall it.</text><rect x="450.5" y="10.5" width="204" height="139" rx="14" fill="#111815" stroke="#1E2A26"/><rect x="470" y="30" width="34" height="34" rx="9" fill="#63F2C2" fill-opacity=".10" stroke="#63F2C2" stroke-opacity=".4"/><text x="487" y="52" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#63F2C2">↻</text><text x="470" y="92" class="s" font-size="15" font-weight="700" fill="#E6F2EE">Execution loops</text><text x="470" y="114" class="s" font-size="12" fill="#A9BDB6">Observe, plan, act, repeat,</text><text x="470" y="131" class="s" font-size="12" fill="#A9BDB6">with sane stop conditions.</text><rect x="675.5" y="10.5" width="204" height="139" rx="14" fill="#111815" stroke="#1E2A26"/><rect x="695" y="30" width="34" height="34" rx="9" fill="#63F2C2" fill-opacity=".10" stroke="#63F2C2" stroke-opacity=".4"/><text x="712" y="52" text-anchor="middle" class="m" font-size="15" font-weight="700" fill="#63F2C2">!</text><text x="695" y="92" class="s" font-size="15" font-weight="700" fill="#E6F2EE">Failure handling</text><text x="695" y="114" class="s" font-size="12" fill="#A9BDB6">Retries, validation and</text><text x="695" y="131" class="s" font-size="12" fill="#A9BDB6">recovery when tools break.</text></svg>